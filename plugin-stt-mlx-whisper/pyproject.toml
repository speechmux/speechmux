[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "speechmux-plugin-stt-mlx-whisper"
version = "0.1.0"
description = "SpeechMux STT Plugin — mlx-whisper engine (Apple Silicon)"
requires-python = ">=3.10"
dependencies = [
    "speechmux-plugin-stt>=0.0.0",
    "mlx-whisper>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.entry-points."speechmux.stt_engine"]
mlx_whisper = "speechmux_plugin_stt_mlx_whisper.engine:MlxWhisperEngine"

[tool.hatch.build.targets.wheel]
packages = ["src/speechmux_plugin_stt_mlx_whisper"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.10"
strict = true

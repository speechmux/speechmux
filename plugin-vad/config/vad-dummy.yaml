# VAD Plugin configuration — Dummy engine (load testing, no model required)

server:
  socket: /tmp/speechmux/vad.sock   # UDS path this plugin process listens on. Must match plugins.yaml endpoint socket.
  engine: dummy                      # Dummy engine: cycles speech/silence at fixed intervals.
  log_level: INFO                    # Logging verbosity: DEBUG | INFO | WARNING | ERROR.
  max_concurrent_sessions: 100       # Max concurrent StreamVAD sessions. Higher for load testing.

engine:
  dummy:                    # Dummy VAD engine settings. No model weights required.
    speech_prob: 0.8        # Fixed speech probability returned for every frame (0.0–1.0).
    latency_ms: 5.0         # Artificial per-frame delay (ms). Simulates VAD processing time.
    speech_ms: 2000         # Cycle mode: speech window duration (ms). Triggers EPD after silence_ms.
    silence_ms: 700         # Cycle mode: silence window duration (ms). EPD fires after this gap.

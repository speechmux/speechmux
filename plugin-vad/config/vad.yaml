# VAD Plugin configuration

server:
  socket: /tmp/speechmux/vad.sock   # UDS path this plugin process listens on. Must match plugins.yaml endpoint socket.
  engine: silero                     # Engine to load (entry-point name from speechmux.vad_engine group).
  log_level: INFO                    # Logging verbosity: DEBUG | INFO | WARNING | ERROR.
  max_concurrent_sessions: 50        # Max concurrent StreamVAD sessions. Set to match Core's max_sessions.

engine:
  silero:                          # Silero VAD engine settings (engine: silero).
    threshold: 0.5                 # Speech probability threshold (0.0–1.0). Lower = more sensitive.
    min_speech_duration_ms: 250    # Min speech segment duration (ms). Shorter bursts are ignored.
    min_silence_duration_ms: 100   # Min silence duration (ms) before closing a speech segment.
    optimal_frame_ms: 32           # Frame size fed to Silero (ms). 32ms = 512 samples @ 16kHz.

  dummy:                    # Dummy VAD engine settings (engine: dummy). No model weights required.
    speech_prob: 0.8        # Fixed speech probability returned for every frame (0.0–1.0).
    latency_ms: 0.0         # Artificial per-frame delay (ms). Use to simulate slow VAD for load testing.
    speech_ms: 0            # Cycle mode: speech window duration (ms). 0 = fixed-probability mode.
    silence_ms: 0           # Cycle mode: silence window duration (ms). 0 = fixed-probability mode.
